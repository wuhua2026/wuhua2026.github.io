<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理数据坐标纠偏 · 案例</title>
<style>
  :root{
    --ink:#0F1B2D; --ink2:#3A4655; --muted:#78838F; --line:#E5E8EC;
    --bg:#F7F8FA; --acc:#1A5FB4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
                "Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 64px;}

  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:26px;
    position:sticky;top:0;background:rgba(247,248,250,.94);
    backdrop-filter:saturate(180%) blur(10px);z-index:5;
  }
  .back{font-size:14px;color:var(--acc);font-weight:600;}
  .back::before{content:"← ";}
  .dl{
    font-size:13.5px;font-weight:600;color:#fff;background:var(--acc);
    border-radius:7px;padding:7px 14px;
  }
  .dl:hover{background:#154F98;}

  h1{font-size:clamp(21px,3.4vw,27px);letter-spacing:-.3px;line-height:1.4;}
  .sub{color:var(--muted);font-size:14px;margin-top:8px;}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-top:24px;
  }
  .card img{width:100%;height:auto;border-radius:7px;display:block;cursor:zoom-in;}
  .hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:11px;}

  .points{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;}
  .pt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 15px;}
  .pt b{display:block;font-size:23px;font-weight:700;letter-spacing:-.4px;}
  .pt span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;}

  .note{
    margin-top:24px;font-size:13px;color:var(--ink2);line-height:1.9;
    border-left:2px solid #DCE4EE;padding-left:16px;
  }

  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted);}

  @media (max-width:620px){
    .points{grid-template-columns:1fr;gap:8px;}
    .pt{display:flex;align-items:baseline;gap:10px;padding:13px 14px;}
    .pt span{margin-top:0;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <a class="back" href="../">返回样本列表</a>
    <a class="dl" href="./case-card.pdf" download>下载 PDF</a>
  </div>

  <h1>312 条点位整体偏移，我把它修到残差归零</h1>
  <p class="sub">西安历史建筑数据 · WGS84 / GCJ-02 混用导致 462 m 系统偏差</p>

  <div class="points">
    <div class="pt"><b>312</b><span>条点位批量处理</span></div>
    <div class="pt"><b>462<span style="font-size:14px">m</span></b><span>发现的系统偏移</span></div>
    <div class="pt"><b>0<span style="font-size:14px">m</span></b><span>修正后残差</span></div>
  </div>

  <div class="card">
    <img src="./case-card.png" alt="地理数据坐标纠偏案例卡" id="img">
    <div class="hint">点击图片可查看原尺寸</div>
  </div>

  <p class="note">
    这类错误不会报错：图能画出来、表能导出，但所有位置整体偏了几百米。
    等到报批被打回或评审被指出，返工成本已经是几倍。
    因此交付前固定做三项自检——坐标抽已知地标比对、条数逐项对账、结果随机抽查。
  </p>

  <footer>
    案例数据来自公开数据集，非客户委托项目；仅展示处理方法，不含任何委托方信息。
  </footer>

</div>

<script>
  document.getElementById('img').addEventListener('click', function () {
    window.open(this.src, '_blank');
  });
</script>
</body>
</html>
